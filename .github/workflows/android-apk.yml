name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Design Upgrade ZIP
        run: |
          mkdir -p extracted project
          unzip -o Sindh-University-Entry-Test-Preparation-Design-Upgrade.zip -d extracted

          PUBSPEC=$(find extracted -name pubspec.yaml -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found in ZIP"
            exit 1
          fi

          SOURCE_DIR=$(dirname "$PUBSPEC")
          cp -a "$SOURCE_DIR"/. project/

          test -f project/lib/main.dart
          test -f project/tool/configure_android.py
          test -f project/google-services.json

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        working-directory: project
        run: |
          flutter create . --platforms=android --org com.sindhuniversity --project-name entrytest

      - name: Configure Firebase
        working-directory: project
        run: python3 tool/configure_android.py

      - name: Install dependencies
        working-directory: project
        run: flutter pub get

      - name: Generate App Icon
        working-directory: project
        run: dart run flutter_launcher_icons

      - name: Build Release APK
        working-directory: project
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sindh-University-Entry-Test-APK
          path: project/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
